# OpenAPI 契约 — 贾克斯模式后端 API
# 版本：v1.2（V1.5 M1 voice 网关）2026-08-04
# 基础路径：http://127.0.0.1:8000
# 说明：前后端对照开发依据；WS 契约见文末 schema
# M-1 修订：① 时间字段 date-time→unix 秒（与 state.py 实发一致）② voice 端点标 x-implemented:false（V1.1）
#           ③ capture_mode 枚举补 pending-auth/lost ④ /health 补 model_vram_mb（标 V1.1 未实现）
#           ⑤ WS pet_state/voice_transcript 标 x-phase:v1.1
# V1.5-M1 修订：⑥ 新增 WS /ws/voice 语音流契约（mobile-voice-spec §7）⑦ 新增 POST /api/v1/voice/pair、
#                GET /api/v1/voice/status（x-phase: v1.5-m1，已实现）
# V1.5-M2 修订：⑧ 新增中继服务契约 POST /relay/pair + WS /relay/ws（x-phase: v1.5-m2，已实现）
#               部署目标 = CloudBase（CloudRun 容器，支持长连接 WS；实现见 backend/relay/）

openapi: 3.0.3
info:
  title: 贾克斯模式 - AI 智能体监控中枢 API
  version: 1.0.0
  description: 桌宠 UI 与后端的全部 HTTP/WS 接口契约

servers:
  - url: http://127.0.0.1:8000
    description: 本机后端

paths:
  # ========== 状态查询 ==========
  /api/v1/status:
    get:
      summary: 全局状态汇总（监控目标 + 每会话状态）
      operationId: getStatus
      responses:
        "200":
          description: 状态快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalStatus"
        "503":
          description: 模型服务未就绪

  /api/v1/status/sessions/{app_id}:
    get:
      summary: 单个被监控会话详情
      operationId: getSession
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            type: string
            example: codex
      responses:
        "200":
          description: 会话状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"

  # ========== 控制指令 ==========
  /api/v1/control:
    post:
      summary: 控制指令（启停监控 / 手动触发提醒测试）
      operationId: sendControl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlCommand"
      responses:
        "202":
          description: 指令已受理
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                    example: true
        "400":
          description: 指令非法

  /api/v1/control/test-push:
    post:
      summary: 测试推送（手动验证手机可达）
      operationId: testPush
      responses:
        "200":
          description: 推送测试结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResult"

  # ========== 语音（V1.1，未实现） ==========
  # 后端 routes_control.py 未实现 voice 端点；WS control 收到 voice_wake/voice_suspend 仅 echo ack
  # 排期：V1.1（关联 OPEN-DECISIONS O-005 / O-003）
  /api/v1/voice/wake:
    post:
      summary: 唤醒语音会话（进入 Listening）【V1.1 未实现】
      operationId: voiceWake
      x-implemented: false
      x-phase: v1.1
      responses:
        "202":
          description: 语音会话已唤醒

  /api/v1/voice/suspend:
    post:
      summary: 挂起语音会话（回落 Monitoring）【V1.1 未实现】
      operationId: voiceSuspend
      x-implemented: false
      x-phase: v1.1
      responses:
        "202":
          description: 语音会话已挂起

  # ========== voice 网关（mobile-voice-spec §8/§10，V1.5 M1 落地） ==========
  # 实时音频走 WS（/ws/voice），不走 REST；控制面如下。
  /api/v1/voice/pair:
    post:
      summary: 配对码 + token 签发（M1 stub：局域网直连；中继配对属 M2）
      operationId: createVoicePair
      x-phase: v1.5-m1
      x-implemented: true
      responses:
        "200":
          description: 配对码 + token
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, example: 0}
                  data:
                    type: object
                    properties:
                      pairing_code: {type: string, example: "123456"}
                      token: {type: string}
                      expires_in_s: {type: integer, example: 300}
                      ts: {type: integer, format: unix-epoch}

  /api/v1/voice/status:
    get:
      summary: 语音网关状态（phone 在线数 / 路径 / 引擎 / STT 模型状态）
      operationId: getVoiceStatus
      x-phase: v1.5-m1
      x-implemented: true
      responses:
        "200":
          description: 网关状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, example: 0}
                  data:
                    type: object
                    properties:
                      relay: {type: string, example: lan_direct}
                      path: {type: string, enum: [A, B]}
                      engine: {type: string, example: half_duplex}
                      stt_model: {type: string, enum: [ok, missing, runtime_missing, error]}
                      tts: {type: string, example: zh-CN-XiaoxiaoNeural}
                      online: {type: integer}
                      sessions:
                        type: array
                        items:
                          type: object
                          properties:
                            device_id: {type: string}
                            state: {type: string, enum: [monitoring, listening, thinking, speaking, idle]}
                            path: {type: string, example: B}
                            stt_model_ok: {type: boolean}
                            buffer_bytes: {type: integer}
                            last_rx: {type: number, format: unix-epoch}

  # ========== 中继服务（mobile-voice-spec §6/§7，V1.5 M2 落地，backend/relay/） ==========
  # 独立服务：python -m backend.relay.relay_server（uvicorn 端口 19090），纯透传不解析不存储。
  # 部署目标：CloudBase（CloudRun 容器，支持长连接 WS）；局域网直连不走中继（见 /ws/voice）。
  /relay/pair:
    post:
      summary: 签发配对码 + 中继连接信息（配对主流程走 WS /relay/ws 的 pair 帧）
      operationId: createRelayPair
      x-phase: v1.5-m2
      x-implemented: true
      x-deploy: cloudbase
      responses:
        "200":
          description: 配对码 + WS 连接信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, example: 0}
                  data:
                    type: object
                    properties:
                      pairing_code: {type: string, example: "123456"}
                      ws_url: {type: string, example: "wss://relay.example.com/relay/ws"}
                      token_required: {type: boolean}
                      e2ee_enabled: {type: boolean}
                      ts: {type: integer, format: unix-epoch}
                  message: {type: string, example: "配对码已签发"}

  # ========== 配置热重载 ==========
  /api/v1/config/reload:
    post:
      summary: 热重载 config/*.yaml（改配置即生效）
      operationId: reloadConfig
      responses:
        "200":
          description: 重载结果（含非法项清单）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  errors:
                    type: array
                    items:
                      type: string
                    example: []

  # ========== 健康检查 ==========
  /health:
    get:
      summary: 后端健康检查
      operationId: healthCheck
      responses:
        "200":
          description: 健康状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  model_server:
                    type: string
                    example: up
                  model_vram_mb:
                    type: integer
                    example: 9400
                    description: 模型显存占用 MB（显存守卫用；后端主进程暂未实现 nvml 查询）
                    x-implemented: false
                    x-phase: v1.1

components:
  schemas:
    GlobalStatus:
      type: object
      properties:
        engine:
          type: object
          properties:
            model_loaded:
              type: boolean
            vram_mb:
              type: integer
            inference_busy:
              type: boolean
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/AgentSession"
        pet_state:
          type: string
          enum: [idle, monitoring, listening, thinking, speaking, alerting]
        updated_at:
          type: number
          format: unix-epoch
          description: 全局状态快照时间，Unix 秒（后端 state.py 实发 float，前端按 number 消费）

    AgentSession:
      type: object
      required: [app_id, app_name, state]
      properties:
        app_id:
          type: string
          example: codex
        app_name:
          type: string
          example: OpenAI Codex
        window_found:
          type: boolean
        capture_mode:
          type: string
          enum: [wgc, dxgi, none, pending-auth, lost]
          description: 捕获模式。wgc=Windows 图形捕获（已授权）；dxgi=整屏兜底；none=未捕获；pending-auth=窗口已找到但未授权（session_manager.locate_all 实发）；lost=窗口丢失/授权失效（设计值，V1.1 落地）
        state:
          type: string
          enum: [progress, stuck, off_track, unknown, offline]
        last_state:
          type: string
          enum: [progress, stuck, off_track, unknown, offline]
        state_changed_at:
          type: number
          format: unix-epoch
          description: 状态变更时间，Unix 秒（后端 state.py 实发 float，前端已按 number 消费）
        stuck_frames:
          type: integer
          description: 连续不变帧数
        last_summary:
          type: string
          description: 最近一次视觉分析摘要（单行）
        last_suggestion:
          type: string
          description: 最近优化建议（P1）
        last_frame_at:
          type: number
          format: unix-epoch
          description: 最近捕获帧时间，Unix 秒（后端 state.py 实发 float）
        frame_count:
          type: integer
        last_analysis_ms:
          type: integer
          description: 最近一次视觉判定耗时（毫秒）
        alert_level:
          type: integer
          enum: [0, 1, 2, 3, 4]
          description: 当前渐进打扰级别

    ControlCommand:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [start_monitoring, stop_monitoring, pause_monitoring, resume_monitoring, trigger_alert_test]
        target:
          type: string
          description: 目标 app_id；缺省 = 全部
          example: codex

    PushResult:
      type: object
      properties:
        ok:
          type: boolean
        provider:
          type: string
          example: wecom
        error:
          type: string
          nullable: true

  # ========== WS /ws/pet 消息契约 ==========
  # 方向：backend → UI
  #   {type: "event", event: "session_updated", data: AgentSession}          ✅ 已实现（routes_ws.py:43）
  #   {type: "event", event: "alert", data: {app_id, level: 1-4, state, summary, suggestion?}}  ✅ 已实现（routes_ws.py:46）
  #   {type: "event", event: "pet_state", data: {state: "listening", payload: {...}}}  ⏳ V1.1 未实现（events.py 已定义 EVT_PET_STATE，WsHub 未订阅广播）
  #   {type: "event", event: "voice_transcript", data: {text, is_final}}                 ⏳ V1.1 未实现（events.py 已定义 EVT_VOICE_TRANSCRIPT，WsHub 未订阅广播）
  #   {type: "pong", ts: 1234567890}                                     ✅ 已实现（心跳应答）
  # 方向：UI → backend
  #   {type: "ping", ts: 1234567890}                                     ✅ 已实现
  #   {type: "control", action: "trigger_alert_test", target: "codex"}   ✅ 已实现（echo ack 受理）
  #   {type: "control", action: "voice_wake"}                            ⏳ V1.1 未实现（仅 echo ack，不进入 Listening）
  #   {type: "control", action: "voice_suspend"}                         ⏳ V1.1 未实现（仅 echo ack，不回落 Monitoring）
  #
  # 心跳：UI 每 15s 发 ping，backend 回 pong；断开自动重连（指数退避，上限 30s）
  # WS 契约修订记录：pet_state / voice_transcript / voice 控制指令均标 x-phase: v1.1（后端 WsHub 仅广播 session_updated/alert）

  # ========== WS /ws/voice 语音流契约（mobile-voice-spec §7，V1.5 M1） ==========
  # 端点：WS /ws/voice（局域网直连主端点）；/api/v1/voice/stream 为同协议别名（M1 已实现）
  # 鉴权：?token= 查询参数 或 hello.token（.env VOICE_TOKEN；未配置时为开发态放行）
  # 帧格式：
  #   控制帧 = WS 文本帧（JSON，见下方 schema）
  #   音频帧 = WS 二进制帧：[0x02][seq:u32 BE][ts_ms:u64 BE][payload]（payload=PCM16 16k 或 E2EE 密文）
  # 上行（手机 → PC）：hello / audio_start / audio_end / wake / cancel / heartbeat / speech_start / speech_end / interrupt
  # 下行（PC → 手机）：ready / session_state / transcript / audio_start / audio_end / reply_done / error / pong / ping
  #
  # 一轮对话（路径 B 半双工）：
  #   phone: hello → pc: ready → phone: wake → phone: 音频帧流 → phone: audio_end
  #   → pc: session_state(thinking) → pc: transcript(final) → pc: session_state(speaking)
  #   → pc: audio_start → pc: 下行音频帧流 → pc: audio_end(done) → pc: reply_done → pc: session_state(monitoring)
  #
  # 握手示例（控制帧 JSON）：
  #   {"type":"hello","role":"phone","device_id":"samsung-s24","app_version":"0.1.0",
  #    "audio":{"dir":"up","format":"pcm_s16le_16k","chunk_ms":40},"features":["wakeword","bargein"]}
  #   {"type":"ready","session_id":"vs-1780000000-xxxx","audio":{"up":"pcm_s16le_16k","down":"mp3_24k"}}
  #
  # VoiceControlFrame（控制帧，统一 schema，x-phase: v1.5-m1）
  #   type: hello|audio_start|audio_end|wake|cancel|heartbeat|speech_start|speech_end|interrupt
  #        |ready|session_state|transcript|audio_start|audio_end|reply_done|error|pong|ping
  #   通用字段：ts(unix_ms) / device_id / session_id
  #   session_state.state ∈ {monitoring, listening, thinking, speaking, idle}
  #   error.code ∈ {auth_failed, bad_frame, kicked, stt_unavailable, tts_unavailable, empty, timeout, internal}
  #   audio_end.reason ∈ {done, interrupted, error}
  #   reply_done.route ∈ {brain, local}
  # 心跳：客户端每 15-30s 发 {"type":"heartbeat"} → 服务端回 {"type":"pong"}；服务端每 30s 主动 ping
  # 互斥：同 device_id 新 hello 踢旧连接（旧连接收 {"type":"error","code":"kicked"} 后关闭）
  # 状态：会话状态变化经 GET /api/v1/voice/status 查询；EVT 广播复用 EventBus（V1.5 M3）
  # TODO(M3)：路径 A 全双工（apm_bridge）接入后补充 interrupt/barge-in 语义，x-phase 升 v1.5-m3

  # ========== WS /relay/ws 中继契约（mobile-voice-spec §6/§7，V1.5 M2） ==========
  # 端点：WS /relay/ws（独立中继服务，端口 19090；部署目标 CloudBase CloudRun）
  # 鉴权：?token= 查询参数 或 pair 帧内 token（.env RELAY_TOKEN；未配置=开发态放行，生产必须配置）
  # 角色：手机(role=phone) 与 PC(role=pc) 使用同一 pairing_code 各自连入 → 中继双向绑定
  # 帧格式：与 /ws/voice 同构 —— 控制帧=WS 文本帧(JSON)；音频帧=WS 二进制帧
  #   [0x02][seq:u32 BE][ts_ms:u64 BE][payload]（E2EE 时 payload=密文，中继只见密文）
  # 握手（配对帧）：
  #   {"type":"pair","role":"phone|pc","device_id":"...","pairing_code":"..."}
  #   中继回 {"type":"paired","session_id":"...","peer":{"role","device_id"}}
  # 控制帧类型（中继自身处理，不透传）：pair / paired / peer_left / heartbeat / pong / error
  #   其余控制帧与音频帧一律原样透传给对端（纯透传不解析不存储）
  # 心跳：两端每 15s heartbeat → 中继回 pong；60s 无帧踢连接并通知对端 peer_left
  # E2EE：AES-256-GCM（.env RELAY_E2EE_KEY 32 字节 base64，两端共享），AAD=帧头含 seq 防重放
  # 安全边界：中继不落盘、不解析、不日志内容；WSS(TLS) 生产强制
  # 联调脚本：scripts/mock_phone_client.py（mock_phone → relay → PC relay_client → voice 网关）
