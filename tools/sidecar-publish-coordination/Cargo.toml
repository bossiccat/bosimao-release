[package]
name = "sidecar-publish-coordination"
version = "0.1.0"
edition = "2021"

[lib]
name = "sidecar_publish_coordination"
path = "src/lib.rs"

[[bin]]
name = "sidecar-publish-coordination"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
