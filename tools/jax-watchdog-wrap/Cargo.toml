[package]
name = "jax-watchdog-wrap"
version = "0.1.0"
edition = "2021"
description = "GUI-subsystem wrapper that runs scripts/jax-watchdog.ps1 with zero console flash (CREATE_NO_WINDOW)"

[[bin]]
name = "jax-watchdog-wrap"
path = "src/main.rs"

[lib]
name = "jax_watchdog_wrap"
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = "z"
lto = true
