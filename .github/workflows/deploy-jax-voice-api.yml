# =============================================================================
# jax-voice-api 云端部署流水线（CloudBase CloudRun）
#
# 目的：部署这件事不再依赖任何本机 shell。
#   - 构建在 CI runner 上完成，镜像 tag = commit SHA（不可变、可回滚、可审计）；
#   - 运行时凭据（DSN / TRTC / cipher key）保存在 **CloudRun 服务配置本身**，
#     按镜像部署会保留，因此仓库与 CI 都不持有任何明文凭据；
#   - 部署是否成功，由**产品自身**的探针判定（/cloud/status 的存储分步探针 +
#     /cloud/selfcheck 的控制面写入链路），而不是靠人看日志或外部脚本解读。
#
# 为什么不做"CI 里打包源码上传"：那仍需在流水线里组装源码目录（拷 Dockerfile、
# 拼上下文），本质还是脚本解题；镜像化之后构建输入只有 tracked 源码本身。
#
# 必须在 GitHub 侧配置（缺任一项 preflight 直接失败，绝不带病部署）：
#   Secrets: TENCENTCLOUD_SECRETID / TENCENTCLOUD_SECRETKEY   tcb 登录
#            TCR_REGISTRY / TCR_NAMESPACE / TCR_USERNAME / TCR_PASSWORD  镜像推送
#            VOICE_OWNER_CREDENTIAL  自检端点鉴权（与 CloudRun 上同一值）
#   Vars:    VPC_ID / VPC_CIDR / SUBNET_ID / SUBNET_CIDR  CloudRun 出网接入 PG 内网
# =============================================================================
name: deploy-jax-voice-api

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要部署的 ref（留空 = 触发时的 commit）"
        required: false
        default: ""
      confirm:
        description: "输入 deploy 才会真正执行（防误触）"
        required: true
        default: ""
  push:
    tags:
      - "voice-api-v*"

permissions:
  contents: read

env:
  SERVICE_NAME: jax-voice-api
  ENV_ID: jinhong-d2g55ycl591208475
  IMAGE_REPO: jax-voice-api
  PUBLIC_BASE_URL: https://jax-voice-api-283963-7-1436773060.sh.run.tcloudbase.com

jobs:
  deploy:
    name: build-image-and-deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.sha }}

      - name: Preflight - required configuration
        env:
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
          TCR_REGISTRY: ${{ secrets.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          VOICE_OWNER_CREDENTIAL: ${{ secrets.VOICE_OWNER_CREDENTIAL }}
          VPC_ID: ${{ vars.VPC_ID }}
          VPC_CIDR: ${{ vars.VPC_CIDR }}
          SUBNET_ID: ${{ vars.SUBNET_ID }}
          SUBNET_CIDR: ${{ vars.SUBNET_CIDR }}
        run: |
          set -euo pipefail
          missing=0
          for name in TENCENTCLOUD_SECRETID TENCENTCLOUD_SECRETKEY TCR_REGISTRY \
                      TCR_NAMESPACE TCR_USERNAME TCR_PASSWORD VOICE_OWNER_CREDENTIAL \
                      VPC_ID VPC_CIDR SUBNET_ID SUBNET_CIDR; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::部署所需的配置不完整，拒绝继续（fail-closed）"
            exit 1
          fi

      - name: Build canonical image (context = repo root)
        run: |
          set -euo pipefail
          docker build \
            -f cloudapi/Dockerfile \
            -t "${TCR_REGISTRY}/${TCR_NAMESPACE}/${IMAGE_REPO}:${GITHUB_SHA}" \
            .

      - name: Push image to TCR
        env:
          TCR_REGISTRY: ${{ secrets.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$TCR_PASSWORD" | docker login "$TCR_REGISTRY" -u "$TCR_USERNAME" --password-stdin
          docker push "${TCR_REGISTRY}/${TCR_NAMESPACE}/${IMAGE_REPO}:${GITHUB_SHA}"

      - name: Install and authenticate CloudBase CLI
        env:
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        run: |
          set -euo pipefail
          npm install -g @cloudbase/cli
          tcb login --apiKeyId "$TENCENTCLOUD_SECRETID" --apiKey "$TENCENTCLOUD_SECRETKEY"

      - name: Deploy image with VPC attachment
        env:
          TCR_REGISTRY: ${{ secrets.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
          VPC_ID: ${{ vars.VPC_ID }}
          VPC_CIDR: ${{ vars.VPC_CIDR }}
          SUBNET_ID: ${{ vars.SUBNET_ID }}
          SUBNET_CIDR: ${{ vars.SUBNET_CIDR }}
        run: |
          set -euo pipefail
          # VpcConf 只有 CLI 的 --vpcConfig 会真正落盘（MCP 的 deploy/updateConfig
          # 回报 applied 但实测不生效），且该命令会保留服务上既有的环境变量。
          printf '\n' | tcb cloudrun deploy \
            -s "$SERVICE_NAME" \
            --imageUrl "${TCR_REGISTRY}/${TCR_NAMESPACE}/${IMAGE_REPO}:${GITHUB_SHA}" \
            --vpcConfig "{\"vpcId\":\"${VPC_ID}\",\"vpcCIDR\":\"${VPC_CIDR}\",\"subnetId\":\"${SUBNET_ID}\",\"subnetCIDR\":\"${SUBNET_CIDR}\"}" \
            --force

      - name: Verify deployment through the product itself
        env:
          VOICE_OWNER_CREDENTIAL: ${{ secrets.VOICE_OWNER_CREDENTIAL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, ssl, sys, time, urllib.request

          base = os.environ.get(
              "PUBLIC_BASE_URL",
              "https://jax-voice-api-283963-7-1436773060.sh.run.tcloudbase.com",
          )
          owner = os.environ["VOICE_OWNER_CREDENTIAL"]
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          def call(path, method="GET", body=None, headers=None):
              req = urllib.request.Request(
                  base + path, data=body, method=method,
                  headers=headers or {"User-Agent": "ci-gate"},
              )
              return urllib.request.urlopen(req, timeout=60, context=ctx)

          # 1) 能力位 + 存储分步探针：read/write/nonce/limit/pairing 必须全 ok。
          #    存储探针能通过，本身即证明 VPC 接入与 PG 连通都成立。
          deadline = time.time() + 300
          status = None
          while time.time() < deadline:
              try:
                  status = json.loads(call("/api/v1/voice/cloud/status").read())
                  if status["data"]["production"]:
                      break
              except Exception:
                  pass
              time.sleep(10)
          if not status:
              sys.exit("状态端点不可达，部署判定失败")
          data = status["data"]
          print("status:", json.dumps(data, ensure_ascii=False))
          if not data.get("production"):
              sys.exit("服务未以生产模式运行")
          if data.get("security_missing"):
              sys.exit(f"生产安全能力缺失: {data['security_missing']}")
          storage = data.get("storage", "")
          if "ok" not in storage or "=" not in storage:
              sys.exit(f"存储探针异常: {storage!r}")
          bad = [s for s in storage.split("|") if not s.strip().endswith("ok")]
          if bad:
              sys.exit(f"存储探针未全绿: {bad}")

          # 2) 控制面写入自检：由服务自身对真实数据库跑一遍完整链路
          resp = call("/api/v1/voice/cloud/selfcheck", method="POST",
                      headers={"Authorization": f"Bearer {owner}",
                               "User-Agent": "ci-gate"})
          payload = json.loads(resp.read())
          print("selfcheck:", json.dumps(payload, ensure_ascii=False))
          if not payload["data"]["ok"]:
              sys.exit(f"自检未通过: {payload['data']['steps']}")
          print("部署验证通过：存储探针全绿 + 控制面自检全绿")
          PY
