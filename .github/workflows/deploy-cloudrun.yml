# =============================================================================
# 云端部署流水线（CloudBase CloudRun）—— 覆盖控制面与音频桥两个服务
#
# 目的：部署这件事不依赖任何本机 shell，且**缺配置时 fail-closed**（绝不带病上线）。
#   - 构建在 CI runner 上完成，镜像 tag = commit SHA（不可变、可回滚、可审计）；
#   - 运行时配置（DSN / TRTC / hello 密钥 / QWEN / RTC_BRIDGE / VPC 等）由本流水线
#     从 GitHub Secrets/Vars 显式注入，仓库与镜像都不持有明文值；
#   - preflight 对**本次矩阵服务需要的每一个键**逐个校验非空，缺任一项即打印缺失
#     键名（只打键名、绝不打值）并以非零码中止；
#   - 部署是否成功由**产品自身**的探针判定：
#       jax-voice-api    → /api/v1/voice/cloud/status（生产位 + 存储分步探针）+ /cloud/selfcheck
#       jax-voice-bridge → /api/v1/voice/bridge/status（两个子进程存活 + rtc_bridge 健康）
#     不看日志、不靠人解读。
#
# ⚠️ VpcConf 必须由本流水线注入：它此前只存在于云端控制台，全仓无记录；一旦丢失，
#    实例就连不到内网 PostgreSQL。api 与 bridge 挂同一 VPC/子网——bridge 内的
#    rtc_bridge 要经 VPC 出口回调控制面，出口源 IP 才能落进控制面的窄白名单。
#
# =============================================================================
# ⚠️ 已知缺口（显式记录，**未修复**——是否修复需要单独决策，本流水线不自行发明回滚）
#
# 「部署先于验证、失败不回滚」：
#   · 顺序是 Deploy image with VPC attachment（切流）→ Verify deployment through the
#     product itself（产品自证）。两者之间**没有任何回滚步骤**：一旦自证失败，坏 revision
#     已经在线，流水线只是以非零码把问题暴露出来，线上并不会自动恢复。
#   · 为什么只能先切流：CloudRun 没有「先验证再切流」的原子操作，而产品自证探针只能打到
#     **已上线**的实例上，所以验证天然发生在切流之后。
#   · 人工回退（唯一可靠路径，未自动化）：
#       1) 读出该服务当前的所有在线版本：
#            tcb api tcbr DescribeCloudRunServerDetail --api-version 2022-02-17 \
#              --body '{"EnvId":"<ENV_ID>","ServerName":"<service>"}' --json
#          在返回的 data.OnlineVersionInfos 里找到**上一个已知good的 revision**，
#          取它对应的镜像地址。
#       2) 用那个镜像重新部署（镜像 tag 就是 commit SHA，不可变、可审计，所以任选历史版本）：
#            tcb cloudrun deploy -s "<service>" --port "<port>" \
#              --imageUrl "<上一步取到的镜像>" \
#              --vpcConfig '{"vpcId":"...","vpcCIDR":"...","subnetId":"...","subnetCIDR":"..."}' \
#              --force
#          （--vpcConfig 必须原样带上，否则服务会丢掉 VPC 接入、连不到内网 PG。）
#
# fail-fast: false 的取舍（见 job 的 strategy）：
#   · 两条矩阵腿彼此独立、互不取消，好处是 api 与 bridge 都能拿到各自完整的自证结论，
#     不会因为一边先失败就把另一边掐掉；
#   · 代价是**可能出现半上线**——一边部署成功、另一边在更早的步骤（含部署前的测试门禁）失败，
#     于是线上只有一半服务是新的。因此看一次运行结果必须**同时看两条矩阵腿**，
#     不能只看第一条；跨服务的强一致（全绿才切流）需要另做两阶段发布，不在本流水线范围内。
# =============================================================================
#
# 部署前的测试门禁：在 Build 之前先跑 backend/tests/contract（控制面与桥的契约层）与
# sidecar 的纯 node 用例，任一失败即以非零码中止，构建/推送/注入/部署都不再执行。
# 这些门禁步骤刻意不带 if / continue-on-error，确保不存在「测试没跑却照常部署」的路径。
#
# 必须在 GitHub 侧配置（键名与用途见
# docs/plans/2026-09-07-voice-cloud-session-migration.md「部署配置固化」；值一律不落仓库）：
#   Secrets: TENCENTCLOUD_SECRETID / TENCENTCLOUD_SECRETKEY   tcb 登录
#            TCR_REGISTRY / TCR_NAMESPACE / TCR_USERNAME / TCR_PASSWORD  镜像推送
#            VOICE_OWNER_CREDENTIAL  自检端点鉴权（与 CloudRun 上同一值）
#            其余运行时键（见 job env）可放 Secrets，亦可放 Vars
#   Vars:    VPC_ID / VPC_CIDR / SUBNET_ID / SUBNET_CIDR  CloudRun 出网接入 PG 内网
# =============================================================================
name: deploy-cloudrun

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要部署的 ref（留空 = 触发时的 commit）"
        required: false
        default: ""
      confirm:
        description: "输入 deploy 才会真正执行（防误触）"
        required: true
        default: ""
  push:
    tags:
      - "voice-api-v*"
      - "voice-bridge-v*"

permissions:
  contents: read

env:
  ENV_ID: ${{ vars.CLOUDBASE_ENV_ID }}

jobs:
  deploy:
    name: deploy-${{ matrix.service }}
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy')
    strategy:
      # fail-fast: false —— 两条腿各自独立拿到自证结论，互不取消；代价是可能出现「半上线」。
      # 取舍与人工回退方式见文件顶部「已知缺口」注释。
      fail-fast: false
      matrix:
        include:
          - service: jax-voice-api
            dockerfile: cloudapi/Dockerfile
            port: 9000
            base_url: https://jax-voice-api-283963-7-1436773060.sh.run.tcloudbase.com
            gate: api
            # 该服务运行时的必需键（缺任一 → preflight 非零中止）。
            # 生产位 + 存储 + 安全能力 + hello 运行时装配所需的密钥全在此列。
            required_env: >-
              VOICE_PRODUCTION VOICE_STORAGE_BACKEND VOICE_DATABASE_URL
              VOICE_TLS_ENABLED RTC_TERMINATION_ENABLED VOICE_OWNER_CREDENTIAL
              VOICE_SIDECAR_CREDENTIAL TRTC_SDKAPPID TRTC_SECRETKEY
              VOICE_HELLO_PRIVATE_KEY_PEM VOICE_HELLO_PUBLIC_KEY_PEM
              VOICE_RTC_BRIDGE_CERT_BINDING VOICE_RTC_BRIDGE_CREDENTIAL
              VOICE_GATEWAY_SHARED_ASSERTION VOICE_TRUSTED_GATEWAY_HOSTS
          - service: jax-voice-bridge
            dockerfile: cloudbridge/Dockerfile
            port: 9200
            base_url: https://jax-voice-bridge-283963-7-1436773060.sh.run.tcloudbase.com
            gate: bridge
            # rtc_bridge 经 VPC 出口回调控制面所需的 mTLS 凭据与断言，缺一不可。
            required_env: >-
              CONTROL_PLANE_BASE_URL VOICE_SIDECAR_CREDENTIAL TRTC_SDKAPPID
              TRTC_SECRETKEY QWEN_REALTIME_WS_URL QWEN_REALTIME_API_KEY
              RTC_BRIDGE_CONTROL_PLANE_BASE_URL RTC_BRIDGE_SERVICE_CREDENTIAL
              RTC_BRIDGE_GATEWAY_ASSERTION RTC_BRIDGE_CLIENT_CERT_PEM
              RTC_BRIDGE_CLIENT_KEY_PEM RTC_BRIDGE_CONTROL_PLANE_CA_FILE
    # 运行时配置来源：值一律不落仓库。优先 Secrets；该键未定义时回退同名 Vars
    # （非敏感开关如 VOICE_PRODUCTION / VPC_* 可放 Vars）。
    # 这里声明的是**来源映射**，preflight 会对本次矩阵服务实际需要的键逐个校验非空；
    # 若某个在 required_env 里的键没有在这里声明来源，它会因取到空值而被拦住
    # （契约测试 test_required_env_manifest_matches_injection 会静态锁死这一点）。
    env:
      TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
      TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
      TCR_REGISTRY: ${{ secrets.TCR_REGISTRY }}
      TCR_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
      TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
      VPC_ID: ${{ vars.VPC_ID }}
      VPC_CIDR: ${{ vars.VPC_CIDR }}
      SUBNET_ID: ${{ vars.SUBNET_ID }}
      SUBNET_CIDR: ${{ vars.SUBNET_CIDR }}
      VOICE_PRODUCTION: ${{ secrets.VOICE_PRODUCTION || vars.VOICE_PRODUCTION }}
      VOICE_STORAGE_BACKEND: ${{ secrets.VOICE_STORAGE_BACKEND || vars.VOICE_STORAGE_BACKEND }}
      VOICE_DATABASE_URL: ${{ secrets.VOICE_DATABASE_URL || vars.VOICE_DATABASE_URL }}
      VOICE_TLS_ENABLED: ${{ secrets.VOICE_TLS_ENABLED || vars.VOICE_TLS_ENABLED }}
      RTC_TERMINATION_ENABLED: ${{ secrets.RTC_TERMINATION_ENABLED || vars.RTC_TERMINATION_ENABLED }}
      VOICE_OWNER_CREDENTIAL: ${{ secrets.VOICE_OWNER_CREDENTIAL || vars.VOICE_OWNER_CREDENTIAL }}
      VOICE_SIDECAR_CREDENTIAL: ${{ secrets.VOICE_SIDECAR_CREDENTIAL || vars.VOICE_SIDECAR_CREDENTIAL }}
      TRTC_SDKAPPID: ${{ secrets.TRTC_SDKAPPID || vars.TRTC_SDKAPPID }}
      TRTC_SECRETKEY: ${{ secrets.TRTC_SECRETKEY || vars.TRTC_SECRETKEY }}
      VOICE_HELLO_PRIVATE_KEY_PEM: ${{ secrets.VOICE_HELLO_PRIVATE_KEY_PEM || vars.VOICE_HELLO_PRIVATE_KEY_PEM }}
      VOICE_HELLO_PUBLIC_KEY_PEM: ${{ secrets.VOICE_HELLO_PUBLIC_KEY_PEM || vars.VOICE_HELLO_PUBLIC_KEY_PEM }}
      VOICE_RTC_BRIDGE_CERT_BINDING: ${{ secrets.VOICE_RTC_BRIDGE_CERT_BINDING || vars.VOICE_RTC_BRIDGE_CERT_BINDING }}
      VOICE_RTC_BRIDGE_CREDENTIAL: ${{ secrets.VOICE_RTC_BRIDGE_CREDENTIAL || vars.VOICE_RTC_BRIDGE_CREDENTIAL }}
      VOICE_GATEWAY_SHARED_ASSERTION: ${{ secrets.VOICE_GATEWAY_SHARED_ASSERTION || vars.VOICE_GATEWAY_SHARED_ASSERTION }}
      VOICE_TRUSTED_GATEWAY_HOSTS: ${{ secrets.VOICE_TRUSTED_GATEWAY_HOSTS || vars.VOICE_TRUSTED_GATEWAY_HOSTS }}
      CONTROL_PLANE_BASE_URL: ${{ secrets.CONTROL_PLANE_BASE_URL || vars.CONTROL_PLANE_BASE_URL }}
      QWEN_REALTIME_WS_URL: ${{ secrets.QWEN_REALTIME_WS_URL || vars.QWEN_REALTIME_WS_URL }}
      QWEN_REALTIME_API_KEY: ${{ secrets.QWEN_REALTIME_API_KEY || vars.QWEN_REALTIME_API_KEY }}
      RTC_BRIDGE_CONTROL_PLANE_BASE_URL: ${{ secrets.RTC_BRIDGE_CONTROL_PLANE_BASE_URL || vars.RTC_BRIDGE_CONTROL_PLANE_BASE_URL }}
      RTC_BRIDGE_SERVICE_CREDENTIAL: ${{ secrets.RTC_BRIDGE_SERVICE_CREDENTIAL || vars.RTC_BRIDGE_SERVICE_CREDENTIAL }}
      RTC_BRIDGE_GATEWAY_ASSERTION: ${{ secrets.RTC_BRIDGE_GATEWAY_ASSERTION || vars.RTC_BRIDGE_GATEWAY_ASSERTION }}
      # PEM 内容（不是路径）：容器内由 cloudbridge/tls_material.py 落成 0o600 临时文件；
      # CA 用镜像内已装的系统信任库路径，避免把 11.9KB 的 bundle 塞进 5KB 上限的 EnvParam。
      RTC_BRIDGE_CLIENT_CERT_PEM: ${{ secrets.RTC_BRIDGE_CLIENT_CERT_PEM || vars.RTC_BRIDGE_CLIENT_CERT_PEM }}
      RTC_BRIDGE_CLIENT_KEY_PEM: ${{ secrets.RTC_BRIDGE_CLIENT_KEY_PEM || vars.RTC_BRIDGE_CLIENT_KEY_PEM }}
      RTC_BRIDGE_CONTROL_PLANE_CA_FILE: ${{ secrets.RTC_BRIDGE_CONTROL_PLANE_CA_FILE || vars.RTC_BRIDGE_CONTROL_PLANE_CA_FILE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.sha }}

      - name: Resolve the checked-out commit (single deploy identity)
        id: commit
        run: |
          set -euo pipefail
          # 唯一提交标识：ref 可能是 workflow_dispatch 手动指定的 ref，此时 GITHUB_SHA 是
          # **触发分支的 tip**，与真正检出的提交不是同一个东西。镜像 tag / 推送 / 部署 /
          # 自证必须共用这里解析出来的 commit，否则会出现「镜像内容与 tag/部署名对不上」。
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Preflight - required infrastructure configuration
        run: |
          set -euo pipefail
          missing=0
          # 这一组必须**非空**，两类理由：
          # · ENV_ID（来源 vars.CLOUDBASE_ENV_ID）是部署目标环境的唯一标识。
          #   为空时后续 tcb 调用会打到空目标；必须在任何 tcb 调用之前挡住。
          # · VPC_ID / VPC_CIDR / SUBNET_ID / SUBNET_CIDR 为空时，deploy 步骤的
          #   --vpcConfig 会变成"字段全空"的对象，把 jax-voice-api **已配置**的
          #   VpcConf 整块抹掉（bridge 的本就是空的，无影响）。api 失去内网通路
          #   就连不到 PG，而控制面是端侧唯一依赖 → 产品整体不可用。
          for name in ENV_ID TENCENTCLOUD_SECRETID TENCENTCLOUD_SECRETKEY TCR_REGISTRY \
                      TCR_NAMESPACE TCR_USERNAME TCR_PASSWORD VOICE_OWNER_CREDENTIAL \
                      VPC_ID VPC_CIDR SUBNET_ID SUBNET_CIDR; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::部署所需的基础配置不完整，拒绝继续（fail-closed）"
            echo "::error::缺失项来源: ENV_ID<-vars.CLOUDBASE_ENV_ID; VPC_ID/VPC_CIDR/SUBNET_ID/SUBNET_CIDR<-同名 Vars; TCR_*/TENCENTCLOUD_*<-同名 Secrets"
            exit 1
          fi

      - name: Preflight - required service configuration (${{ matrix.service }})
        run: |
          set -euo pipefail
          # 只打印缺失的**键名**，绝不打印任何值。
          missing=""
          for name in ${{ matrix.required_env }}; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::${{ matrix.service }} 缺少必需环境变量（仅键名）:$missing"
            echo "::error::拒绝构建与部署（fail-closed）"
            exit 1
          fi
          echo "${{ matrix.service }} 必需环境变量齐备（${{ matrix.required_env }}）"

      - name: Setup Python for pre-deploy tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pre-deploy test dependencies
        run: |
          set -euo pipefail
          # 干净检出上的**最小依赖闭包**（实测：只有这些也能让 backend/tests/contract 全绿）。
          # 刻意不用 requirements.txt：其中 windows-capture / pywin32 / sounddevice /
          # silero-vad / sherpa-onnx 是 Windows 或原生专属，ubuntu runner 根本装不上。
          # 版本与仓库 requirements.txt 保持一致，避免两套锁。
          python -m pip install --disable-pip-version-check \
            pytest==9.1.1 pytest-asyncio==1.4.0 PyYAML==6.0.3 \
            fastapi==0.141.1 httpx==0.28.1 pydantic==2.13.4 pydantic-settings==2.14.2 \
            numpy==2.4.6 pillow==12.3.0 psutil==7.2.2 \
            cryptography==50.0.0 PyJWT==2.10.1 uvicorn==0.52.1 websockets==17.0.1 \
            jsonschema==4.26.0 openapi-schema-validator==0.9.0 openapi-spec-validator==0.9.0

      - name: Pre-deploy gate - backend contract tests
        run: |
          set -euo pipefail
          # 这批契约测试是守护本次改动的核心层；失败即中止，构建/推送/注入/部署都不执行。
          python -m pytest backend/tests/contract -q

      - name: Pre-deploy gate - sidecar node tests
        shell: bash
        run: |
          set -euo pipefail
          cd sidecar
          # runner 上没有 node_modules（刻意不 npm ci：本步骤不装 electron）。以下三个文件
          # 硬编码 node_modules/electron/dist/electron.exe（Windows 专属路径）并需要
          # electron + trtc-electron-sdk，在 ubuntu 上必然失败，属于**真机门禁**，故排除。
          # 用排除法而非白名单：以后新增的纯 node 用例会自动纳入门禁。
          exclude='^(audio-contract|exit-lifecycle|sdk-smoke)\.test\.js$'
          selected=()
          for f in test/*.test.js; do
            base=${f##*/}
            if [[ "$base" =~ $exclude ]]; then
              echo "skip (needs electron/trtc SDK on a real machine): $f"
              continue
            fi
            selected+=("$f")
          done
          if [ "${#selected[@]}" -eq 0 ]; then
            echo "::error::没有收集到任何 sidecar 用例，拒绝继续（fail-closed）"
            exit 1
          fi
          echo "running ${#selected[@]} sidecar test files"
          node --test "${selected[@]}"

      - name: Build canonical image (context = repo root)
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          SERVICE: ${{ matrix.service }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          set -euo pipefail
          docker build \
            -f "${DOCKERFILE}" \
            -t "${TCR_REGISTRY}/${TCR_NAMESPACE}/${SERVICE}:${COMMIT}" \
            .

      - name: Push image to TCR
        env:
          SERVICE: ${{ matrix.service }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          set -euo pipefail
          echo "$TCR_PASSWORD" | docker login "$TCR_REGISTRY" -u "$TCR_USERNAME" --password-stdin
          docker push "${TCR_REGISTRY}/${TCR_NAMESPACE}/${SERVICE}:${COMMIT}"

      - name: Install and authenticate CloudBase CLI
        run: |
          set -euo pipefail
          npm install -g @cloudbase/cli
          tcb login --apiKeyId "$TENCENTCLOUD_SECRETID" --apiKey "$TENCENTCLOUD_SECRETKEY"

      - name: Inject service configuration (${{ matrix.service }})
        env:
          SERVICE: ${{ matrix.service }}
          REQUIRED_ENV: ${{ matrix.required_env }}
        run: |
          set -euo pipefail
          # 注入机制（2026-09-12 实测确定，原实现用的是错的通道）
          # ---------------------------------------------------------------
          # · `tcb cloudrun deploy` **没有** env 参数；
          # · `tcb secrets set` 是**环境级**（全环境服务共享），而这里的运行时配置是
          #   **服务级**的，写进去不会落到本服务的 EnvParams；旧版 CLI 甚至没有该子命令。
          # · 唯一可靠通道是 tcbr 原生 API：
          #       SubmitServerConfigChangeDiff --api-version 2022-02-17
          #       body = {EnvId, ServerName, Items:[{Key:"EnvParam", Value:"<字符串化 JSON>"}]}
          #   —— 注意 **写 `EnvParam`（单数）、读回 `EnvParams`（复数）**，且 Value 是**字符串**。
          # · **EnvParam 是整表覆盖**：只发新键会清空既有键 → 必须先读回现值再合并。
          # · Items 只改列出的项 → VpcConf / Port 不受影响。
          python3 - <<'PY'
          import json, os, subprocess, sys

          API_VERSION = "2022-02-17"
          env_id = os.environ["ENV_ID"]
          service = os.environ["SERVICE"]
          required = os.environ["REQUIRED_ENV"].split()

          def tcb_api(action, body):
              out = subprocess.run(
                  ["tcb", "api", "tcbr", action, "--api-version", API_VERSION,
                   "--body", json.dumps(body), "--json"],
                  capture_output=True, text=True, check=True).stdout
              return json.loads(out[out.find("{"):])     # 首行是 "i → TCBR.xxx" 提示

          # 1) 读回现有 EnvParams（整表覆盖，必须带上）
          detail = tcb_api("DescribeCloudRunServerDetail",
                           {"EnvId": env_id, "ServerName": service})["data"]
          raw = (detail.get("ServerConfig") or {}).get("EnvParams") or "{}"
          current = json.loads(raw) if isinstance(raw, str) else dict(raw)

          # 2) 合并本次要注入的键（只打键名，绝不打值）
          added, missing = [], []
          for name in required:
              value = os.environ.get(name, "")
              if not value:
                  missing.append(name)
                  continue
              if current.get(name) != value:
                  added.append(name)
              current[name] = value
          if missing:
              print(f"::error::{service} 注入阶段缺值（仅键名）: {' '.join(missing)}")
              sys.exit(1)

          # 3) 提交（整表覆盖语义 → 发合并后的全量）
          tcb_api("SubmitServerConfigChangeDiff", {
              "EnvId": env_id, "ServerName": service,
              "Items": [{"Key": "EnvParam", "Value": json.dumps(current, ensure_ascii=False)}],
          })

          # 4) 读回自证：必需键必须全部存在（只比键名，不比值）
          back = tcb_api("DescribeCloudRunServerDetail",
                         {"EnvId": env_id, "ServerName": service})["data"]
          back_raw = (back.get("ServerConfig") or {}).get("EnvParams") or "{}"
          got = json.loads(back_raw) if isinstance(back_raw, str) else dict(back_raw)
          lost = [n for n in required if n not in got]
          if lost:
              print(f"::error::{service} 注入后读回缺键（仅键名）: {' '.join(lost)}")
              sys.exit(1)
          print(f"{service}: 注入完成（键数 {len(got)}，变更 {len(added)}，环境变量整表覆盖语义已处理）")
          PY

      - name: Deploy image with VPC attachment
        env:
          SERVICE: ${{ matrix.service }}
          PORT: ${{ matrix.port }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          set -euo pipefail
          # VpcConf 只有 CLI 的 --vpcConfig 会真正落盘（MCP 的 deploy/updateConfig
          # 回报 applied 但实测不生效），且该命令会保留服务上既有的环境变量。
          # api 需要它连内网 PG；bridge 也需要它——rtc_bridge 经 VPC 出口回调控制面，
          # 出口源 IP 才能落进控制面的窄白名单。
          printf '\n' | tcb cloudrun deploy \
            -s "$SERVICE" \
            --port "$PORT" \
            --imageUrl "${TCR_REGISTRY}/${TCR_NAMESPACE}/${SERVICE}:${COMMIT}" \
            --vpcConfig "{\"vpcId\":\"${VPC_ID}\",\"vpcCIDR\":\"${VPC_CIDR}\",\"subnetId\":\"${SUBNET_ID}\",\"subnetCIDR\":\"${SUBNET_CIDR}\"}" \
            --force

      - name: Verify deployment through the product itself
        env:
          GATE: ${{ matrix.gate }}
          BASE_URL: ${{ matrix.base_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, ssl, sys, time, urllib.request

          gate = os.environ["GATE"]
          base = os.environ["BASE_URL"]
          owner = os.environ["VOICE_OWNER_CREDENTIAL"]
          # TLS：**必须**用默认校验（验证书链 + 验主机名）。
          # 此处曾写 `check_hostname = False` + `verify_mode = ssl.CERT_NONE`，
          # 而紧接着下方会用这条连接把 **生产 owner 凭据**（= 全租户 admin：
          # 可列/撤销全部设备、读会话）作为 Bearer 发到生产端点 ⇒ runner 出网链路上
          # 任何 MITM 都能拿到它，且"产品自证"的结论本身可被中间人替换成 PASS。
          # 2026-09-16 实测：jax-voice-api 与 jax-voice-bridge 用**默认校验**握手均通过
          # （DigiCert 链，剩余有效期 140 天）⇒ 恢复校验不会弄挂自证。
          ctx = ssl.create_default_context()

          def call(path, method="GET", headers=None):
              req = urllib.request.Request(
                  base + path, method=method,
                  headers=headers or {"User-Agent": "ci-gate"},
              )
              return urllib.request.urlopen(req, timeout=60, context=ctx)

          def wait_json(path, predicate, seconds=300):
              deadline = time.time() + seconds
              last = None
              while time.time() < deadline:
                  try:
                      last = json.loads(call(path).read())
                      if predicate(last):
                          return last
                  except Exception as exc:
                      last = {"error": type(exc).__name__}
                  time.sleep(10)
              return last

          if gate == "api":
              # 存储分步探针能全绿，本身就证明 VPC 接入与 PostgreSQL 连通都成立。
              status = wait_json(
                  "/api/v1/voice/cloud/status",
                  lambda d: d.get("data", {}).get("production") is True,
              )
              print("status:", json.dumps(status, ensure_ascii=False))
              data = (status or {}).get("data") or {}
              if not data.get("production"):
                  sys.exit("服务未以生产模式运行")
              if data.get("security_missing"):
                  sys.exit(f"生产安全能力缺失: {data['security_missing']}")
              storage = data.get("storage", "")
              if "=" not in storage or any(
                  not part.strip().endswith("ok") for part in storage.split("|")
              ):
                  sys.exit(f"存储探针未全绿: {storage!r}")
              payload = json.loads(call(
                  "/api/v1/voice/cloud/selfcheck", method="POST",
                  headers={"Authorization": f"Bearer {owner}", "User-Agent": "ci-gate"},
              ).read())
              print("selfcheck:", json.dumps(payload, ensure_ascii=False))
              if not payload["data"]["ok"]:
                  sys.exit(f"控制面自检未通过: {payload['data']['steps']}")
              print("部署验证通过：存储探针全绿 + 控制面自检全绿")

          elif gate == "bridge":
              # 音频桥的自证：两个子进程存活 + rtc_bridge 健康 + TRTC SDK 已装载。
              payload = wait_json("/api/v1/voice/bridge/status", lambda d: d.get("ok") is True)
              print("bridge status:", json.dumps(payload, ensure_ascii=False))
              data = payload or {}
              if not data.get("ok"):
                  sys.exit(f"音频桥未就绪: {json.dumps(payload, ensure_ascii=False)[:600]}")
              for child in ("rtc_bridge", "sidecar"):
                  if not data.get(child, {}).get("alive"):
                      sys.exit(f"{child} 未存活: {json.dumps(data.get(child), ensure_ascii=False)}")
              if data.get("rtc_bridge_health") != "ok":
                  sys.exit(f"rtc_bridge 健康探测异常: {data.get('rtc_bridge_health')!r}")
              if not data.get("trtc_sdk_version"):
                  sys.exit("未能确认 TRTC SDK 版本")
              print("部署验证通过：音频桥两个子进程存活 + rtc_bridge 健康 + SDK 已装载")

          else:
              sys.exit(f"未知的 gate: {gate}")
          PY
