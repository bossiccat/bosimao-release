name: release-governance

on:
  pull_request:
  push:
    tags:
      - "v*"
  # 本仓 `git tag -l` = 0 ⇒ 上面两条从未触发过 release job。没有 workflow_dispatch
  # 就根本没有"手动跑一次看现场"的入口，Phase 0 会一直停在纸面上。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    name: build-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify CloudRun canonical source is tracked
        # jax-voice-api 只允许由 tracked canonical source 构建；未跟踪的旧树不得进入候选包
        run: |
          set -euo pipefail
          git ls-files --error-unmatch cloudapi/CANONICAL_SOURCE.json
          git ls-files --error-unmatch cloudapi/Dockerfile
          git ls-files --error-unmatch cloudapi/main.py
          git ls-files --error-unmatch cloudapi/requirements.txt
          git ls-files --error-unmatch cloudbase/migrations
          # deploy/backend 是 forbidden legacy source tree（绕过 PostgreSQL 门禁），永不允许被跟踪
          if git ls-files --error-unmatch deploy/backend >/dev/null 2>&1; then
            echo "forbidden CloudRun source tree is tracked: deploy/backend" >&2
            exit 1
          fi
      - name: Build immutable release candidate
        # 归档 tree 而不是 commit，并钉住条目 mtime。原因（见
        # outputs/claim-artifact-self-reference-proposal.md §1）：
        #   * 以 commit 为源时，归档字节里有 pax_global_header 记录的那次提交 id，
        #     且每个条目 mtime = 那次提交的时间 ⇒ 换一个提交，字节必变
        #     （哪怕两棵树一模一样）；
        #   * 以 tree 为源并加 --mtime 后，产物只由树内容决定 ⇒ governance/claims/**
        #     被 .gitattributes export-ignore 排除后，claims 那次提交与其父提交
        #     产出**完全相同**的字节，claim 才有可能记下自己的产物哈希。
        # 该时间戳自此属于产物身份的一部分，不可再改（改了等于换产物）。
        run: >-
          git archive --format=tar.gz
          --mtime="2000-01-01T00:00:00Z"
          --output="${{ runner.temp }}/release-candidate.tar.gz"
          "$GITHUB_SHA^{tree}"
      - name: Write candidate checksum
        run: >-
          (cd "${{ runner.temp }}" &&
          sha256sum release-candidate.tar.gz > release-candidate.tar.gz.sha256)
      - name: Write candidate provenance
        run: >-
          python scripts/release_governance/verify_candidate_provenance.py create
          --candidate-path "${{ runner.temp }}/release-candidate.tar.gz"
          --output "${{ runner.temp }}/release-candidate.provenance.json"
          --repo-root .
      - name: Upload candidate, checksum, and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: |
            ${{ runner.temp }}/release-candidate.tar.gz
            ${{ runner.temp }}/release-candidate.tar.gz.sha256
            ${{ runner.temp }}/release-candidate.provenance.json
          if-no-files-found: error

  verify:
    name: verify
    needs: build-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Download release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-input
      - name: Verify candidate checksum
        working-directory: ${{ runner.temp }}/release-input
        run: sha256sum --check release-candidate.tar.gz.sha256
      - name: Verify candidate provenance
        run: >-
          python scripts/release_governance/verify_candidate_provenance.py verify
          --candidate-path "${{ runner.temp }}/release-input/release-candidate.tar.gz"
          --provenance-json "${{ runner.temp }}/release-input/release-candidate.provenance.json"
          --expected-commit "${{ github.sha }}"
          --repo-root .
      - name: Verify release claims
        run: >-
          python scripts/release-preflight.py verify
          --policy governance/release-policy.json
          --claims governance/claims
          --command-lock governance/command-lock.json
          --repo-root .
          --artifact-path "${{ runner.temp }}/release-input/release-candidate.tar.gz"
          --evidence-root artifacts/release-evidence

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Run release governance regression tests
        run: python -m pytest scripts/test_release_governance -q

  release:
    name: release
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    needs: [build-candidate, verify, test]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Download release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-input
      - name: Verify candidate checksum
        working-directory: ${{ runner.temp }}/release-input
        run: sha256sum --check release-candidate.tar.gz.sha256
      - name: Verify candidate provenance
        run: >-
          python scripts/release_governance/verify_candidate_provenance.py verify
          --candidate-path "${{ runner.temp }}/release-input/release-candidate.tar.gz"
          --provenance-json "${{ runner.temp }}/release-input/release-candidate.provenance.json"
          --expected-commit "${{ github.sha }}"
          --repo-root .
      - name: Create release evidence and manifest
        if: success()
        env:
          RELEASE_EVIDENCE_HMAC_KEY: ${{ secrets.RELEASE_EVIDENCE_HMAC_KEY }}
        run: >-
          python scripts/release-preflight.py release
          --release-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --policy governance/release-policy.json
          --claims governance/claims
          --command-lock governance/command-lock.json
          --repo-root .
          --artifact-path "${{ runner.temp }}/release-input/release-candidate.tar.gz"
          --evidence-root artifacts/release-evidence
          --ci-run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Upload release evidence and manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.run_id }}
          path: |
            artifacts/release-evidence/
            artifacts/release-evidence/**/release-manifest.json
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # Phase 0：Windows 专属判据的承载 job（**报告制**）
  #
  # 为什么必须是独立的一条 windows-latest job
  #   * `sidecar_runtime_trust.rs` / `sidecar_integrity.rs` 是 `#[cfg(windows)]`，
  #     在 ubuntu 上编不进去；而 `verify` job 今天在 ubuntu 上跑锁定检查，编出来的
  #     是 **Linux 产物** —— 它的"通过"证明不了任何 Windows 属性（假绿）。
  #   * 5 件原生集（含 180MB externalBin 与那个 CUI 的 liteav_media_server.exe）
  #     由 `npm ci` 提供：`sidecar/node_modules` 未被跟踪（.gitignore:28），
  #     干净 runner 必须自己装（F8）。
  #   * `git tag -l` = 0 ⇒ `release` job 从未触发过。这条 job 是第一次把
  #     Windows 判据真正放进流水线。
  #
  # Phase 0 语义（刻意保守）
  #   PE 子系统扫描用 `--report-only`：只清点不判红（末行标记 `PE_SUBSYSTEM=REPORT_ONLY`，
  #   刻意与 PASS 不同名，避免被误当成门禁通过）。基础设施性失败（依赖安装超时、
  #   构建失败、单测红）照常红 —— 那是"跑不起来"，不是"判得不严"。
  #
  # 本 job **不进入任何 `needs:`** —— release 流程不因它而阻塞（先跑一段时间再说）。
  #
  # ⚠️ 本注释块一度把下面的契约测试撞红：`scripts/test_release_governance/test_ci_policy.py`
  # 的 `test_workflow_cannot_upgrade_claims_to_verified_and_pins_actions` 用「子串扫描」
  # 判 workflow 全文，于是"记录 pin 规则的散文"自己命中了被禁的浮动写法
  # （`@` 紧跟版本号，如 `@` `v4`）。修的时候我还**又犯了一次**：把该字面量
  # 引用进新注释，于是二次撞红。⇒ 此处只描述形状、不复述字面量。
  # pin 已于 2026-09-20 完成。**不要**为通过而放宽那条断言。
  # ───────────────────────────────────────────────────────────────────────────
  windows-popup-gate:
    name: windows-popup-gate
    runs-on: windows-latest
    # job 级兜底：任何一步静默挂住都不该烧到 GitHub 的默认 6 小时
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # （2026-09-21）此处原本有一行"合入前换成 SHA"的待办注释 —— pin 已于 2026-09-20
      # 完成，改为在下面两个 uses 各自行尾标注来源与版本，不再留待办。
      # 两处 SHA 已按本仓惯例 pin（2026-09-20，用 gh api 从上游解析、非手抄）：
      #   dtolnay/rust-toolchain@stable 分支 tip = 6bed0761d98439e5a578e2877258200ad565ba87
      #   actions/setup-node v4 → commit       = 49933ea5288caeca8642d1e84afbd3f7d6820020
      # 工具链版本显式钉 1.97.1：本仓无 `rust-toolchain.toml`，不钉就等于让"今天能编"
      # 依赖 runner 镜像当天的 stable —— 而 android-gates 那次故障正是浮动依赖咬的。
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # ── 第 0 步：依赖安装（**有界**）─────────────────────────────────────
      # 2026-09-19 实测：`npm ci` 在本机静默挂死 17 分钟 —— npm 自带 debug 日志
      # 停在 `13 silly idealTree buildDeps`，**一条 fetch 都没有**，node_modules
      # 与缓存目录近 20 分钟零写入。若在 runner 上同样挂住，这条 job 会一直烧到
      # GitHub 的默认 job 超时，而且**没有任何输出能告诉你卡在哪**。
      # 所以给它上界：显式超时 → 杀掉整棵进程树（含 detached 后代）→ 带出末尾
      # 80 行 + 日志路径 → 退出码 124（与 coreutils timeout(1) 同码，一眼可辨）。
      - name: 安装 sidecar 依赖（有界：900s 超时）
        working-directory: sidecar
        shell: pwsh
        run: >-
          node ../scripts/bounded-exec.mjs
          --timeout-seconds 900
          --tail 80
          --log "${{ runner.temp }}/npm-ci.log"
          --shell
          -- npm ci --no-audit --no-fund

      # ── 第 1 步：物化 binaries/ ───────────────────────────────────────────
      # 必须先做。`cargo build --release` 的 build.rs 会跑 `--verify-only` 当门，
      # 而干净 runner 上 `binaries/` 整个目录被 .gitignore:171 忽略
      # ⇒ 直接编会在第一道就红（SIDECAR_PACKAGE_POINTER_MISSING，F2）。
      - name: 物化 sidecar 世代（binaries/）
        run: node scripts/build-sidecar-external-bin.js

      # ── 两个 provision 助手（externalBin 的第二、三条）────────────────────
      # 为什么需要这一步：`tauri.conf.json` 的 `externalBin` 声明了三条
      #   binaries/jax-rtc-sidecar、binaries/provision_sidecar_credential、
      #   binaries/provision_sidecar_credential_launcher
      # tauri 会按 `<name>-<target-triple><ext>` 去找。第一条由上面的 sidecar 构建
      # 产出；后两条是**本 crate 的 bin 目标**，需要 cargo 先编出来再按三元组后缀
      # 摆进 `binaries/`。而 `binaries/` 整个被 .gitignore 忽略 ⇒ 干净 runner 上没有。
      # 缺它们时 `tauri_build::build()` 会以
      #   `resource path binaries\provision_sidecar_credential-x86_64-pc-windows-msvc.exe doesn't exist`
      # 让 `cargo build --release` 直接红（2026-09-20 run 35515153178 实测）。
      #
      # 先编这两个 bin 必须先跳过 tauri_build —— 否则 build.rs 会在这个 bin 还没产出
      # 之前就去解析资源并失败。`build.rs:185-188` 的 `JAX_SKIP_TAURI_BUILD=1` 就是
      # 为这种场景留的逃生门（注释写明"纯逻辑测试不需要完整资源拷贝"）。
      #
      # 必须显式开 `credential-test-support`：`Cargo.toml:30-42` 把这两个 bin 声明为
      #   required-features = ["credential-test-support"]
      # 且写明**默认构建刻意不编译它们**——原因是 tauri main binary 的 auto-discovery
      # 曾与这两个 bin 混淆，导致 `release/jax-pet.exe` 被硬链接成 provision 的内容。
      # 同一段注释还写明安装器产物「已由独立 `cargo build --bins` 编译后复制」——
      # 也就是这一步在文档里存在、但 CI 从未实现过（2026-09-21 补上）。
      # 只编这两个 bin（不用 `--bins`）更外科：不会顺带编出 o018/o020 那几个测试助手，
      # 也**不会**影响随后那次不带 feature 的 `cargo build --release`（主二进制照旧）。
      - name: 编出 provision 双助手（跳过 tauri_build，避免先解析不存在的资源）
        working-directory: pet-ui/src-tauri
        env:
          JAX_SKIP_TAURI_BUILD: "1"
        run: >-
          cargo build --release
          --features credential-test-support
          --bin provision_sidecar_credential
          --bin provision_sidecar_credential_launcher

      - name: 把 provision 双助手按 target-triple 后缀摆进 binaries/
        working-directory: pet-ui/src-tauri
        shell: pwsh
        run: |
          $suffix = 'x86_64-pc-windows-msvc'
          $pairs = @(
            @{ src = 'provision_sidecar_credential';        dst = "provision_sidecar_credential-$suffix.exe" },
            @{ src = 'provision_sidecar_credential_launcher'; dst = "provision_sidecar_credential_launcher-$suffix.exe" }
          )
          New-Item -ItemType Directory -Force -Path 'binaries' | Out-Null
          foreach ($p in $pairs) {
            $from = Join-Path 'target/release' ($p.src + '.exe')
            $to   = Join-Path 'binaries' $p.dst
            if (-not (Test-Path -LiteralPath $from)) {
              Write-Error "编出来的 bin 不存在：$from（上一步应当产出它）"
              exit 1
            }
            Copy-Item -LiteralPath $from -Destination $to -Force
            $h = (Get-FileHash -LiteralPath $to -Algorithm SHA256).Hash.ToLower()
            $n = (Get-Item -LiteralPath $to).Length
            Write-Host "staged $($p.dst)  bytes=$n  sha256=$h"
          }

      # tauri 的 `generate_context!()` 要求 `frontendDist` 存在。而 `tauri.conf.json`
      # 把它设为 `"../dist"`，`dist/` 又被 .gitignore:25 忽略 ⇒ 干净 runner 上没有。
      # 我们这一步是**直接** `cargo build --release`，绕过了 `tauri build`，所以它的
      # `beforeBuildCommand`（`npm run build:bundle`）不会自动执行 —— 必须自己先建。
      # （run 35564008878 实测：不建就 `error: proc macro panicked … The frontendDist
      #   configuration is set to "../dist" but this path doesn't exist`，即 src/main.rs:205。）
      - name: 构建前端产物（generate_context! 要求 frontendDist=../dist 存在）
        working-directory: pet-ui
        run: |
          npm ci
          npm run build

      - name: cargo build --release（内含 --verify-only 门）
        working-directory: pet-ui/src-tauri
        run: cargo build --release

      - name: cargo test --lib（Windows-only 判据的牙齿）
        working-directory: pet-ui/src-tauri
        run: cargo test --lib

      # ── Phase 0：PE 子系统扫描（报告制）─────────────────────────────────
      # 口径是"随包集合"而不是"随便找个目录扫"：tauri 把 bundle.resources 拷进
      # `target/release`，所以随包 resources（含 trtc-electron-sdk/build/Release
      # 下那个 CUI）本来就在这棵树里 —— 实测该口径与 `--installed` 等价。
      # `--exclude-cargo-artifacts` 剪掉的只是 build/deps/examples 里的
      # build-script 产物（98 个 CUI），它们从不随包发布。
      - name: PE 子系统扫描（Phase 0：report-only，不判红）
        run: >-
          python scripts/pe-subsystem-verify.py
          --dir pet-ui/src-tauri/target/release
          --recursive --exclude-cargo-artifacts --report-only

      # shell 用 bash 是为了让 `test/*.test.js` 由 shell 展开 —— 与现有
      # deploy-cloudrun.yml 的 `cd sidecar && node --test test/*.test.js` 同口径。
      # （sidecar/test/ 下还有 fixture/probe 这类非测试文件，不宜直接 `node --test test/`。）
      - name: sidecar 单测（Windows 上才装得了 electron/TRTC）
        working-directory: sidecar
        shell: bash
        run: node --test test/*.test.js

      # "有现场"：即使上面某步红了，npm 日志也必须留下来
      - name: 上传诊断现场（npm 日志）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-popup-gate-diagnostics
          path: ${{ runner.temp }}/npm-ci.log
          if-no-files-found: warn
