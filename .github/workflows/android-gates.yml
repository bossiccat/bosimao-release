name: Android gates

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-gates:
    name: Android ${{ matrix.id }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: compile-debug-kotlin
            task: :app:compileDebugKotlin
          - id: test-debug-unit
            task: :app:testDebugUnitTest
          - id: assemble-debug
            task: :app:assembleDebug
          - id: assemble-release
            task: :app:assembleRelease
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android SDK 35
        shell: pwsh
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Prepare isolated build homes
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "android-gates-${{ matrix.id }}"
          $gradleHome = Join-Path $root 'gradle-user-home'
          $projectCache = Join-Path $root 'project-cache'
          New-Item -ItemType Directory -Force -Path $gradleHome, $projectCache | Out-Null
          "GRADLE_USER_HOME=$gradleHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_PROJECT_CACHE=$projectCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare sherpa-onnx dependencies
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\fetch-deps.ps1

      - name: Verify toolchain
        shell: pwsh
        run: |
          java -version
          .\gradlew.bat --version
          $sdk = Join-Path $env:ANDROID_HOME 'platforms\android-35\android.jar'
          if (-not (Test-Path $sdk)) { throw "Android SDK 35 is unavailable: $sdk" }

      - name: Run independent Android gate
        shell: pwsh
        run: .\gradlew.bat ${{ matrix.task }} --no-daemon --stacktrace --project-cache-dir "$env:ANDROID_PROJECT_CACHE"

      - name: Verify APK provenance
        if: ${{ success() && (matrix.id == 'assemble-debug' || matrix.id == 'assemble-release') }}
        shell: pwsh
        run: |
          $debug = 'app\build\outputs\apk\debug\app-debug.apk'
          $release = 'app\build\outputs\apk\release\app-release-unsigned.apk'
          if ('${{ matrix.id }}' -eq 'assemble-debug') {
            if (-not (Test-Path $debug)) { throw "Debug APK missing: $debug" }
            Get-FileHash $debug -Algorithm SHA256
          }
          if ('${{ matrix.id }}' -eq 'assemble-release') {
            if (-not (Test-Path $release)) { throw "Unsigned release APK missing: $release" }
            Get-FileHash $release -Algorithm SHA256
          }

      - name: Upload APK artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-${{ matrix.id }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            mobile-app/app/build/outputs/apk/debug/app-debug.apk
            mobile-app/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Stop Gradle daemon
        if: ${{ always() }}
        shell: pwsh
        run: |
          .\gradlew.bat --stop
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "gradle --stop exited with $LASTEXITCODE"
          }
          exit 0
