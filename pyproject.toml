[project]
name = "jarvis-mode-backend"
version = "0.1.0"
description = "贾克斯模式后端：截图调度 / 视觉判定 / 提醒 / 推送 / WS"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
