[project]
name = "jarvis-mode-backend"
version = "0.1.0"
description = "贾克斯模式后端：截图调度 / 视觉判定 / 提醒 / 推送 / WS"
requires-python = ">=3.11"
dependencies = [
    "cryptography==50.0.0",
    "numpy==2.4.6",
    "PyJWT==2.10.1",
    "jsonschema==4.26.0",
    "openapi-schema-validator==0.9.0",
    "openapi-spec-validator==0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
