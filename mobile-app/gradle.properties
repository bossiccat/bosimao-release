# Jax Voice Gradle 配置
# 注意：不要设 -Dfile.encoding（历史设过 UTF-8）。项目路径含 CJK（"监视app"）且 Windows
# 系统代码页为 GBK 时，Gradle 测试 worker 用 @argfile 传 classpath，JVM 启动器按本机 ANSI
# 代码页解码 → 与 daemon 的 file.encoding 不一致会把 CJK 路径打成乱码（ClassNotFoundException）。
# 让 daemon 跟随平台默认字符集即可对齐（GBK 机器→GBK，UTF-8 机器→UTF-8，天然一致）。
org.gradle.jvmargs=-Xmx2048m
# AndroidX 必须开启
android.useAndroidX=true
# Kotlin 官方代码风格
kotlin.code.style=official
# 非传递 R 类（加速编译）
android.nonTransitiveRClass=true

android.overridePathCheck=true
